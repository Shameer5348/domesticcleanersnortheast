<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domestic Cleaners North East — Coming Soon</title>
<meta name="description" content="Domestic Cleaners North East — spotless homes, happy hearts. Our new site is on its way.">
<link rel="icon" href="domesticcleanersnortheast-site/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --paper:#FBFCFB; --ink:#1C3A42; --ink-soft:#4A656B;
    --glass:#DCEBE6; --glove:#F5C518; --glove-deep:#E0AE00; --rule:#C5D6D0;
    --font-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
    --font-body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); line-height:1.6;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:2rem;
  }
  .card{
    max-width:640px; text-align:center;
  }
  .badge{
    display:inline-block; background:var(--glass); color:var(--ink);
    border:1px solid var(--rule); border-radius:999px;
    padding:0.35em 1em; font-size:0.85rem; letter-spacing:0.08em;
    text-transform:uppercase; margin-bottom:1.75rem;
  }
  h1{
    font-family:var(--font-display); font-weight:700;
    letter-spacing:-0.02em; line-height:1.05;
    font-size:clamp(2rem, 6vw, 3.2rem); margin:0 0 0.5em;
  }
  p.lead{
    color:var(--ink-soft); font-size:1.15rem; margin:0 0 2rem;
  }
  .rule{
    width:64px; height:4px; background:var(--glove); border:none;
    margin:0 auto 2rem; border-radius:2px;
  }
  .contact{
    font-size:1rem;
  }
  .contact a{
    color:var(--ink); font-weight:700; text-decoration-thickness:2px;
    text-underline-offset:0.2em;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Coming Soon</span>
    <h1>Spotless Homes, Happy Hearts</h1>
    <hr class="rule">
    <p class="lead">Domestic Cleaners North East is putting the finishing touches on our new site. We'll be here shortly.</p>
    <p class="contact">In the meantime, get in touch at <a href="mailto:hello@domesticcleanersnortheast.co.uk">hello@domesticcleanersnortheast.co.uk</a></p>
  </div>
</body>
</html>
